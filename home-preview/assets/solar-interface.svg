<text x="943" y="598" font-family="Arial,sans-serif" font-size="10" fill="#87a2bc" letter-spacing="1.2">CURRENT SELECTION</text>
<text x="943" y="622" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#eef5fa">EARTH</text>
<circle cx="1126" cy="607" r="12" fill="url(#earth)"/>
</svg>