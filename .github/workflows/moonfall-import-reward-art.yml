name: Import unique reward card illustrations
on:
  push:
    branches: [moonfall-deck-variety-polish]
    paths:
      - .github/workflows/moonfall-import-reward-art.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import CC0 illustrated portraits as six distinct reward card artworks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p card-game/assets/rewards
          slugs=(
            mage-pyromancer-girl-anime
            ranger-elf-archer-anime
            summoner-dragon-caller-anime
            warrior-shieldmaiden-heroine-anime
            rogue-duelist-noble-anime
            summoner-celestial-invoker-anime
          )
          for i in "${!slugs[@]}"; do
            curl --fail --location --silent --show-error --retry 3 --max-time 35 \
              "https://freegamesprites.com/images/ai-sprites/generated/${slugs[$i]}.png" \
              --output "card-game/assets/rewards/reward-$i.png"
          done
          python3 - <<'PY'
          from pathlib import Path
          import struct
          images=sorted(Path('card-game/assets/rewards').glob('reward-*.png'))
          assert len(images)==6
          for image in images:
              data=image.read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',data[16:24])==(384,512)
              assert len(data)>18000
              print(image,len(data))
          PY
      - name: Commit actual PNG artwork to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-game/assets/rewards
          if ! git diff --cached --quiet; then
            git commit -m "Moonfall: import six unique reward card portraits"
            git push origin HEAD:moonfall-deck-variety-polish
          fi
