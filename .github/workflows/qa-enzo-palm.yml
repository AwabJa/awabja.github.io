name: Temporary live palm and hand physics QA
on:
  push:
    branches:
      - feature/enzo-palm-casting-hand-inertia-20261023
    paths:
      - .github/workflows/qa-enzo-palm.yml
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Create render-only live WebGL harness
        shell: bash
        run: |
          cat > Enzo/hand-review.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="UTF-8">
          <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d20}#qa-status{position:fixed;top:20px;left:24px;z-index:2;color:#abbed9;font:12px Arial;letter-spacing:2px}</style>
          </head><body><span id="qa-status">LOADING</span><script type="module">
          import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
          import { createArcaneWorld } from './src/arcaneWorld.js';
          import { createWorldPolish } from './src/worldPolish.js';
          import { createCastingHand } from './src/castingHand.js';
          const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
          renderer.setSize(window.innerWidth,window.innerHeight);
          renderer.setPixelRatio(1);
          renderer.outputEncoding=THREE.sRGBEncoding;
          renderer.toneMapping=THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure=1.03;
          document.body.append(renderer.domElement);
          const scene=new THREE.Scene();
          const camera=new THREE.PerspectiveCamera(74,window.innerWidth/window.innerHeight,.05,450);
          camera.position.set(0,1.7,0);
          scene.add(camera);
          const hand=createCastingHand(camera);
          window.__hand=hand;
          const world=createArcaneWorld(scene,renderer);
          const polish=createWorldPolish(scene,world,renderer);
          hand.ready.then(info=>document.getElementById('qa-status').textContent=
            'READY / '+info.bones+' BONES').catch(err=>document.getElementById('qa-status').textContent='FAILED / '+err.message);
          let last=performance.now();
          const motion={speed:0,moving:false,sprinting:false,grounded:true,strafe:0,forward:0,jumpHeight:0,verticalSpeed:0};
          window.__setMotion=x=>Object.assign(motion,x);
          function animate(now) {
            const delta=Math.min(.05,(now-last)/1000);last=now;
            hand.update(delta,motion,true);
            world.update(delta);
            polish.update(delta);
            renderer.render(scene,camera);
            requestAnimationFrame(animate);
          }
          requestAnimationFrame(animate);
          </script></body></html>
          HTML
      - name: Launch browser with accelerated software WebGL
        shell: bash
        run: |
          python3 -m http.server 8456 --bind 127.0.0.1 >/tmp/enzo-http.log 2>&1 &
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            '--remote-allow-origins=*' --remote-debugging-port=9222 \
            --user-data-dir=/tmp/enzo-hand-fix-chrome --window-size=1365,768 \
            about:blank >/tmp/enzo-chrome.log 2>&1 &
      - name: Capture genuine idle and casting screenshots after load
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function main(){
            let targets;
            for(let i=0;i<25;i++){
              try{targets=await (await fetch('http://127.0.0.1:9222/json/list')).json();break}
              catch(e){await wait(500)}
            }
            const tab=targets?.find(x=>x.type==='page');
            if(!tab)throw Error('No Chrome CDP page');
            if(typeof WebSocket!=='function')throw Error('Node WebSocket not available');
            const ws=new WebSocket(tab.webSocketDebuggerUrl);
            await new Promise((resolve,reject)=>{
              ws.addEventListener('open',resolve,{once:true});
              ws.addEventListener('error',reject,{once:true});
            });
            let nextId=0;
            const pending=new Map();
            const exceptions=[];
            ws.addEventListener('message',ev=>{
              const data=JSON.parse(ev.data);
              if(data.method==='Runtime.exceptionThrown')
                exceptions.push(data.params?.exceptionDetails?.text||JSON.stringify(data.params));
              if(pending.has(data.id)){
                const p=pending.get(data.id);pending.delete(data.id);
                data.error?p.reject(Error(JSON.stringify(data.error))):p.resolve(data.result);
              }
            });
            function call(method,params={}){
              const id=++nextId;
              return new Promise((resolve,reject)=>{
                const timer=setTimeout(()=>{pending.delete(id);reject(Error('CDP timeout: '+method))},15000);
                pending.set(id,{resolve:v=>{clearTimeout(timer);resolve(v)},reject:e=>{clearTimeout(timer);reject(e)}});
                ws.send(JSON.stringify({id,method,params}));
              });
            }
            const evalJS=async expression=>(await call('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true})).result?.value;
            await call('Page.enable');await call('Runtime.enable');
            await call('Page.navigate',{url:'http://127.0.0.1:8456/Enzo/hand-review.html'});
            let last='';
            let ready=false;
            for(let i=0;i<45;i++){
              await wait(650);
              last=await evalJS("document.getElementById('qa-status')?.textContent||'BOOTING'");
              if(i%8===0)console.log('status:',i,last);
              if(last.startsWith('READY')){ready=true;break}
              if(last.startsWith('FAILED'))break;
            }
            if(!ready)throw Error('Hand never loaded: '+last+' '+JSON.stringify(exceptions));
            await wait(1200);
            const probe=await evalJS("(()=>{let h=window.__hand,f=h.rig.getObjectByName('Short-lived palm energy flash');return {ready:h.isReady(),hidden:!f.visible,distance:f.getWorldPosition(new h.rig.position.constructor()).distanceTo(h.muzzlePosition())}})()");
            console.log('PALM IN IDLE',JSON.stringify(probe));
            if(!probe.ready||!probe.hidden||probe.distance>.13)
              throw Error('Idle flash/shot emitter misaligned '+JSON.stringify(probe));
            fs.mkdirSync('.github/previews',{recursive:true});
            const idle=await call('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});
            fs.writeFileSync('.github/previews/palm-physics-idle.png',Buffer.from(idle.data,'base64'));
            await evalJS("window.__setMotion({speed:5.2,strafe:.5,forward:.85,moving:true});window.__hand.addLookImpulse(55,-25);window.__hand.cast();'cast triggered'");
            await wait(65);
            const casting=await evalJS("(()=>{let h=window.__hand,f=h.rig.getObjectByName('Short-lived palm energy flash');return {visible:f.visible,distance:f.getWorldPosition(new h.rig.position.constructor()).distanceTo(h.muzzlePosition()),position:[h.rig.position.x,h.rig.position.y,h.rig.position.z]}})()");
            console.log('PALM WHILE CASTING',JSON.stringify(casting));
            if(!casting.visible||casting.distance>.13||casting.position.some(x=>!Number.isFinite(x)))
              throw Error('Physical casting not aligned '+JSON.stringify(casting));
            const cast=await call('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});
            fs.writeFileSync('.github/previews/palm-physics-casting.png',Buffer.from(cast.data,'base64'));
            console.log('IDLE PNG BYTES:',fs.statSync('.github/previews/palm-physics-idle.png').size);
            console.log('CAST PNG BYTES:',fs.statSync('.github/previews/palm-physics-casting.png').size);
            console.log('Page exceptions:',JSON.stringify(exceptions));
            await wait(420);
            const after=await evalJS("(()=>{let h=window.__hand,f=h.rig.getObjectByName('Short-lived palm energy flash');h.reset();return{flashHidden:!f.visible,homeX:h.rig.position.x,homeY:h.rig.position.y}})()");
            console.log('RESET',JSON.stringify(after));
            if(!after.flashHidden||Math.abs(after.homeX-.49)>.001||Math.abs(after.homeY+.42)>.001)
              throw Error('Springs did not reset '+JSON.stringify(after));
            if(exceptions.length)throw Error('Browser exceptions: '+JSON.stringify(exceptions));
            if(fs.statSync('.github/previews/palm-physics-idle.png').size<25000)
              throw Error('Probably blank actual hand screenshot');
            ws.close();
          }
          main().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Save temporary preview for visual inspection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/previews/palm-physics-idle.png .github/previews/palm-physics-casting.png
          git commit -m 'Temporary verified palm origin and spring-viewmodel screenshot'
          git push origin HEAD:feature/enzo-palm-casting-hand-inertia-20261023
