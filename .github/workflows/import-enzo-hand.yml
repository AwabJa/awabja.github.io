name: Import licensed hand model (one-time)
on:
  push:
    branches:
      - feature/enzo-phase-a-rigged-hand-20261023
    paths:
      - .github/workflows/import-enzo-hand.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Download original CC0 anatomical hand
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Enzo/assets/models
          curl --fail --location --retry 3 --max-time 65 --silent --show-error \
            'https://www.innerscene.com/api/library/posable-anatomical-right-hand-f6098b4f/download' \
            --output Enzo/assets/models/anatomical-right-hand.glb
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('Enzo/assets/models/anatomical-right-hand.glb')
          data=p.read_bytes()
          assert data[:4]==b'glTF', 'Not a GLB asset'
          version,length=struct.unpack_from('<II',data,4)
          assert version==2 and length==len(data), 'Invalid GLB header'
          assert 65000<len(data)<2000000,'Unexpected GLB size'
          json_len,json_type=struct.unpack_from('<I4s',data,12)
          assert json_type==b'JSON','GLB has no JSON chunk'
          d=json.loads(data[20:20+json_len])
          assert d.get('meshes') and d.get('skins'),'Expected an actual skinned hand mesh and skeleton'
          print('Imported',len(data),'bytes;',len(d['meshes']),'meshes;',len(d['skins']),'skins;')
          print('Bone/node names:',[x.get('name') for x in d.get('nodes',[]) if x.get('name')][:42])
          PY
      - name: Record original asset license and provenance
        run: |
          cat > Enzo/assets/models/RIGHT-HAND-LICENSE.md <<'EOF'
          # Anatomical right-hand model
          
          - Asset: \`anatomical-right-hand.glb\`
          - Original filename: \`hand-posable.glb\`
          - Creator: Innerscene, derived from MakeHuman/MPFB CC0 assets
          - License: Creative Commons Zero 1.0 Universal (CC0; public domain)
          - Source: https://www.innerscene.com/tools/library/3d-parts/posable-anatomical-right-hand-f6098b4f
          - Direct source: https://www.innerscene.com/api/library/posable-anatomical-right-hand-f6098b4f/download
          - Retrieved: 2026-10-23
          
          This is an authored anatomical, rigged and weighted right-hand model,
          **not** code-generated cylinder/sphere fingers. Innerscene explicitly
          grants copying, modification, redistribution, and commercial use.
          The gameplay script recolors and poses it into an arcane glove.
          EOF
      - name: Commit validated model and attribution metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Enzo/assets/models/anatomical-right-hand.glb Enzo/assets/models/RIGHT-HAND-LICENSE.md
          git commit -m 'Import actual CC0 right-hand skinned GLB to replace primitive viewmodel'
          git push origin HEAD:feature/enzo-phase-a-rigged-hand-20261023
