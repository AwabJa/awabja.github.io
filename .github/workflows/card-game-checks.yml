name: Arcana Duel checks

on:
  push:
    paths:
      - 'card-game/**'
      - '.github/workflows/card-game-checks.yml'
  pull_request:
    paths:
      - 'card-game/**'
      - '.github/workflows/card-game-checks.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --check card-game/app.js
      - run: node --check card-game/engine.mjs
      - run: node --test card-game/game.test.mjs
