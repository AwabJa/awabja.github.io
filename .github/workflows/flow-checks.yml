name: FLOW regression checks

on:
  push:
    paths:
      - 'Flow/**'
      - 'tools/flow-*.mjs'
      - 'tools/site-integrity.mjs'
      - '.github/workflows/flow-checks.yml'
  pull_request:
    paths:
      - 'Flow/**'
      - 'tools/flow-*.mjs'
      - 'tools/site-integrity.mjs'
      - '.github/workflows/flow-checks.yml'

permissions:
  contents: read

jobs:
  flow:
    name: FLOW safety and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recurrence and task state
        run: node tools/flow-recurrence-check.mjs
      - name: View startup and interaction
        run: node tools/flow-view-smoke-check.mjs
      - name: Export-only backup safety
        run: node tools/flow-backup-check.mjs
      - name: Site integrity
        run: node tools/site-integrity.mjs
      - name: Large workspace performance regression
        run: node tools/flow-performance-check.mjs
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Desktop and mobile Chromium smoke tests
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v chromium)"
          else
            echo "Chrome or Chromium is required for responsive tests" >&2
            exit 1
          fi
          node tools/flow-browser-check.mjs

