name: CDP hand gameplay visual QA (temporary)
on:
  push:
    branches:
      - feature/enzo-phase-a-rigged-hand-20261023
    paths:
      - .github/workflows/qa-enzo-hand-cdp.yml

permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Launch static HTTP and headless Chrome
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/enzo-http.log 2>&1 &
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            '--remote-allow-origins=*' --remote-debugging-port=9222 \
            --user-data-dir=/tmp/enzo-gl-chrome --window-size=1365,768 \
            about:blank >/tmp/enzo-chrome.log 2>&1 &
          python3 -m pip install --quiet --break-system-packages websocket-client
      - name: Wait for rigged hand and gameplay, then capture screenshot
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,time,urllib.request,os,sys
          from websocket import create_connection
          def get_json(url):
              with urllib.request.urlopen(url,timeout=5) as f:return json.load(f)
          pages=[]
          for i in range(20):
              try: pages=get_json('http://127.0.0.1:9222/json/list');break
              except Exception:time.sleep(1)
          pages=[p for p in pages if p.get('type')=='page']
          assert pages,'No headless Chrome page'
          ws=create_connection(pages[0]['webSocketDebuggerUrl'],timeout=25)
          next_id=0
          errors=[]
          def command(method,params=None):
              global next_id
              next_id+=1;ident=next_id
              ws.send(json.dumps({'id':ident,'method':method,'params':params or {}}))
              limit=time.monotonic()+25
              while time.monotonic()<limit:
                  msg=json.loads(ws.recv())
                  if msg.get('method')=='Runtime.exceptionThrown':
                      errors.append(msg.get('params',{}).get('exceptionDetails',{}).get('text'))
                  if msg.get('id')==ident:
                      if 'error' in msg:raise RuntimeError(method+': '+str(msg['error']))
                      return msg.get('result',{})
              raise TimeoutError(method)
          def evaluate(expr):
              return command('Runtime.evaluate',{'expression':expr,'returnByValue':True,'awaitPromise':True})['result'].get('value')
          command('Page.enable');command('Runtime.enable')
          command('Page.navigate',{'url':'http://127.0.0.1:8123/Enzo/index.html'})
          ready=False;last=None
          for i in range(100):
              time.sleep(1)
              last=evaluate("""({
                 exists:!!document.getElementById('startButton'),
                 disabled:document.getElementById('startButton')?.disabled,
                 status:document.getElementById('menuStatusText')?.textContent,
                 hasWebGL:!!document.querySelector('canvas')
               })""")
              if i%10==0:print('loader',i,last,flush=True)
              if last and last.get('exists') and last.get('disabled')==False:
                  ready=True;break
              if last and last.get('status','').startswith('HAND ASSET FAILED'):break
          assert ready, 'Hand did not initialize: '+str(last)+' pageerrors='+str(errors)
          print('Rigged hand ready. Starting game.',flush=True)
          coords=evaluate("""(()=>{
              let r=document.getElementById('startButton').getBoundingClientRect();
              return {x:r.left+r.width/2,y:r.top+r.height/2};
          })()""")
          command('Input.dispatchMouseEvent',{'type':'mouseMoved','x':coords['x'],'y':coords['y']})
          command('Input.dispatchMouseEvent',{'type':'mousePressed','x':coords['x'],'y':coords['y'],'button':'left','clickCount':1})
          command('Input.dispatchMouseEvent',{'type':'mouseReleased','x':coords['x'],'y':coords['y'],'button':'left','clickCount':1})
          for i in range(16):
              time.sleep(1)
              state=evaluate("""({
                splashHidden:document.getElementById('splashScreen')?.classList.contains('fade-out'),
                hudVisible:!document.getElementById('gameHUD')?.hidden,
                pointerLocked:!!document.pointerLockElement,
                wave:document.getElementById('waveValue')?.textContent
              })""")
              if i%4==0:print('gameplay',state,flush=True)
              if state['splashHidden'] and state['hudVisible'] and state['pointerLocked']:break
          assert state['splashHidden'] and state['hudVisible'] and state['pointerLocked'],'Gameplay not entered: '+str(state)+' errors '+str(errors)
          # Let scene finish a few rendered frames before capture.
          time.sleep(3)
          png=base64.b64decode(command('Page.captureScreenshot',{'format':'png','captureBeyondViewport':False})['data'])
          os.makedirs('.github/previews',exist_ok=True)
          with open('.github/previews/enzo-phase-a-cdp.png','wb') as f:f.write(png)
          print('CAPTURED ACTUAL WEBGL GAMEPLAY:',len(png),'bytes, frame state',state,flush=True)
          assert len(png)>16000,'Unexpected blank gameplay screenshot'
          assert not errors,'Browser JS page exceptions: '+str(errors)
          PY
      - name: Commit temporary actual gameplay screenshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/previews/enzo-phase-a-cdp.png
          git commit -m 'Temporary real WebGL gameplay screenshot for Phase A inspection'
          git push origin HEAD:feature/enzo-phase-a-rigged-hand-20261023
