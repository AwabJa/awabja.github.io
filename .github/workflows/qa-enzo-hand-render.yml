name: QA rigged hand render (temporary)
on:
  push:
    branches:
      - feature/enzo-phase-a-rigged-hand-20261023
    paths:
      - .github/workflows/qa-enzo-hand-render.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create ephemeral hand preview
        shell: bash
        run: |
          set -eu
          cat > Enzo/hand-review.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8">
          <style>html,body{margin:0;background:#0c1424;height:100%;overflow:hidden;color:#dae8fb;font-family:Arial}#status{position:absolute;left:26px;top:26px;letter-spacing:2px;z-index:2}</style>
          </head><body><div id="status">LOADING REAL GLB</div><script type="module">
          import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
          import {createCastingHand} from './src/castingHand.js';
          const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
          r.setSize(innerWidth,innerHeight);r.setPixelRatio(1);
          r.outputEncoding=THREE.sRGBEncoding;
          r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.4;
          document.body.append(r.domElement);
          const scene=new THREE.Scene();scene.background=new THREE.Color(0x0c1424);
          scene.add(new THREE.HemisphereLight(0xc1d8ff,0x2c3855,2.2));
          const key=new THREE.DirectionalLight(0xc6e8ff,3);key.position.set(-1,2,2);scene.add(key);
          const rim=new THREE.DirectionalLight(0x75aeff,2.3);rim.position.set(3,1,-3);scene.add(rim);
          const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.05,100);
          camera.position.set(0,0,0);scene.add(camera);
          const hand=createCastingHand(camera);
          let ready=false;
          hand.ready.then(details=>{
             document.querySelector('#status').textContent='RIGGED MODEL READY / '+details.bones+' BONES';
             ready=true;
          }).catch(err=>{document.querySelector('#status').textContent='MODEL FAILED / '+err.message;});
          function draw(){
            if(ready)hand.update(.016,false,true);
            r.render(scene,camera);
            requestAnimationFrame(draw);
          }
          draw();
          </script></body></html>
          HTML
      - name: Run headless WebGL GLB preview
        shell: bash
        run: |
          set -eu
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/enzo-http.log 2>&1 &
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo 'No headless Chrome binary'; exit 1; }
          echo "Using $CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --virtual-time-budget=10000 --window-size=1360,820 \
            --screenshot=Enzo/assets/hand-qa-preview.png \
            'http://127.0.0.1:8765/Enzo/hand-review.html' >/tmp/chrome.log 2>&1 || {
              tail -n 100 /tmp/chrome.log;exit 1;
            }
          file Enzo/assets/hand-qa-preview.png
          echo "Screenshot bytes: $(stat -c%s Enzo/assets/hand-qa-preview.png)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --virtual-time-budget=10000 --dump-dom \
            'http://127.0.0.1:8765/Enzo/hand-review.html' >/tmp/hand-dom.html 2>/tmp/chrome-dom.log || true
          if grep -q 'RIGGED MODEL READY' /tmp/hand-dom.html; then
            echo "3D hand loader status: READY"
          elif grep -q 'MODEL FAILED' /tmp/hand-dom.html; then
            echo "3D hand loader status: FAILED"
          else
            echo "3D hand loader status: NOT RESOLVED"
          fi
          echo "DOM status: $(grep -o '<div id="status">[^<]*' /tmp/hand-dom.html | head -n1 || true)"
          echo "Browser console diagnostic:"
          tail -n 24 /tmp/chrome-dom.log || true
      - name: Save temporary screenshot for visual review
        shell: bash
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Enzo/assets/hand-qa-preview.png
          git commit -m 'Temporary GLB browser screenshot for viewmodel inspection'
          git push origin HEAD:feature/enzo-phase-a-rigged-hand-20261023
