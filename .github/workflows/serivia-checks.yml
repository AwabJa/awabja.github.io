name: serivia browser checks

on:
  push:
    paths:
      - 'serivia/**'
      - 'tools/serivia-browser-check.mjs'
      - '.github/workflows/serivia-checks.yml'
  pull_request:
    paths:
      - 'serivia/**'
      - 'tools/serivia-browser-check.mjs'
      - '.github/workflows/serivia-checks.yml'

permissions:
  contents: read

jobs:
  browser:
    name: Movie discovery responsive and functional QA
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Test browser UI at desktop, tablet, phone and reduced motion
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v chromium)"
          else
            echo "Chromium required" >&2
            exit 1
          fi
          node tools/serivia-browser-check.mjs
      - name: Upload desktop visual checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: serivia-desktop-visual
          path: serivia-desktop-visual.png
          if-no-files-found: ignore
          retention-days: 3
