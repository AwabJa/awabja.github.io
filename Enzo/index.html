<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enzo FPS | Playable Alpha by A.J. Ahmed</title>
    <meta name="description" content="Play Enzo, a browser-based first-person shooter alpha built with Three.js. Desktop keyboard and mouse required.">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaina+2:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Freckle+Face&display=swap" rel="stylesheet">

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="styles/style.css">
    
    <!-- Transparent Favicon to Prevent 404 -->
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z/C/HwAFgwJ/lMT6kQAAAABJRU5ErkJggg==" type="image/png">

</head>
<body>

    <a class="enzo-back" href="/">← Back to portfolio</a>
    <div id="gameHUD" class="game-hud" aria-live="off" hidden><span>ELIMINATIONS <strong id="killCount">0</strong></span><span>GOAL <strong id="killGoal">5</strong></span><span id="objectiveText">Eliminate 5 enemies</span></div>
    <div id="gameToast" class="game-toast" role="status" aria-live="polite"></div>
    <!-- Splash Screen -->
    <div id="splashScreen">
        <img src="logo.png" alt="Enzo Game Logo" id="splashLogo">
        <!-- Removed the loadingMessage div -->
        <!-- Dedicated Start Button -->
        <p class="game-intro">Survive the arena. Eliminate 5 enemies to complete the challenge.<br>WASD move · Mouse aim/shoot · Space jump · Shift sprint · Esc pause.<br>Desktop keyboard and mouse recommended.</p>
        <button id="startButton" aria-label="Start Game">Start Game</button>
    </div>

    <!-- Pause Screen (Initially Hidden) -->
    <div id="pauseScreen" class="pause-screen">
        <h1>Game Paused</h1>
        <button id="resumeButton" aria-label="Resume Game">Resume Game</button>
        <button id="exitButton" aria-label="Exit to Menu">Exit to Menu</button>
    </div>

    <!-- Crosshair (Initially Hidden) -->
    <div id="crosshair" class="crosshair">
        <div class="horizontal"></div>
        <div class="vertical"></div>
    </div>

    <!-- Include the main.js script -->
    <script type="module" src="./src/main.js"></script>  <!-- Reference to your external JS file -->
    
</body>
</html>
